<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="Segoe UI, Malgun Gothic, sans-serif">
<defs>
  <marker id="ah" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
    <path d="M0 0 L7 3.5 L0 7 Z" fill="#333333"/></marker>
  <marker id="ahr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
    <path d="M0 0 L7 3.5 L0 7 Z" fill="#b3261e"/></marker>
  <marker id="ahi" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
    <path d="M0 0 L7 3.5 L0 7 Z" fill="#4f46e5"/></marker>
</defs>
<rect width="760" height="620" fill="#ffffff"/>
<rect x="18" y="14" width="724" height="592" rx="12" fill="#fbfbfe" stroke="#d5d5e8"/>
<line x1="380" y1="30" x2="380" y2="590" stroke="#e6e6f0" stroke-width="1.2"/>
<line x1="30" y1="310" x2="730" y2="310" stroke="#e6e6f0" stroke-width="1.2"/>

<!-- =============== (a) scan-to-print setup =============== -->
<text x="46" y="46" font-size="13.5" fill="#333333" font-weight="700">Does a local metric help?</text>
<!-- point cloud -->
<g fill="#666666">
 <circle cx="70" cy="150" r="3"/><circle cx="82" cy="140" r="3"/><circle cx="76" cy="162" r="3"/>
 <circle cx="92" cy="152" r="3"/><circle cx="66" cy="138" r="3"/><circle cx="88" cy="168" r="3"/>
 <circle cx="100" cy="140" r="3"/><circle cx="72" cy="176" r="3"/><circle cx="98" cy="166" r="3"/>
</g>
<text x="84" y="200" font-size="11.5" fill="#666666" text-anchor="middle">point cloud</text>
<line x1="118" y1="155" x2="150" y2="155" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/>
<!-- alpha complex -->
<path d="M164 150 L196 132 L214 158 L182 176 Z M196 132 L214 158 M164 150 L214 158" fill="#efeff5" stroke="#c5c5d5" stroke-width="1.4"/>
<circle cx="164" cy="150" r="2.5" fill="#666"/><circle cx="196" cy="132" r="2.5" fill="#666"/><circle cx="214" cy="158" r="2.5" fill="#666"/><circle cx="182" cy="176" r="2.5" fill="#666"/>
<text x="190" y="200" font-size="11.5" fill="#666666" text-anchor="middle">α-complex</text>
<line x1="228" y1="155" x2="258" y2="155" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/>
<!-- mesh shell -->
<path d="M272 140 L312 132 L322 164 L286 178 Z" fill="#e9eef7" stroke="#1d4e89" stroke-width="1.4"/>
<text x="298" y="200" font-size="11.5" fill="#666666" text-anchor="middle">watertight mesh</text>
<line x1="332" y1="155" x2="354" y2="155" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/>
<!-- printer -->
<rect x="330" y="230" width="0" height="0"/>
<g transform="translate(360,150)">
 <rect x="-1" y="-18" width="14" height="30" rx="2" fill="#efeff5" stroke="#c5c5d5" stroke-width="1.4"/>
 <path d="M-1 -6 h14" stroke="#c5c5d5" stroke-width="1.2"/>
</g>
<text x="367" y="200" font-size="11.5" fill="#666666" text-anchor="middle">print</text>
<text x="205" y="286" font-size="12" fill="#333333" text-anchor="middle">reconstruction fidelity drives the printed part</text>
<text x="205" y="302" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">(a)</text>

<!-- =============== (b) rescore a FIXED complex -> bridge survives =============== -->
<text x="410" y="46" font-size="13" fill="#333333" font-weight="700">Rescore one fixed complex</text>
<!-- two thin opposing sheets -->
<rect x="410" y="96" width="180" height="16" rx="4" fill="#efeff5" stroke="#c5c5d5" stroke-width="1.3"/>
<rect x="410" y="150" width="180" height="16" rx="4" fill="#efeff5" stroke="#c5c5d5" stroke-width="1.3"/>
<g fill="#666"><circle cx="440" cy="112" r="2.4"/><circle cx="470" cy="112" r="2.4"/><circle cx="500" cy="112" r="2.4"/><circle cx="530" cy="112" r="2.4"/><circle cx="560" cy="112" r="2.4"/>
<circle cx="440" cy="150" r="2.4"/><circle cx="470" cy="150" r="2.4"/><circle cx="500" cy="150" r="2.4"/><circle cx="530" cy="150" r="2.4"/><circle cx="560" cy="150" r="2.4"/></g>
<line x1="600" y1="112" x2="600" y2="150" stroke="#999" stroke-width="1"/>
<text x="628" y="134" font-size="10.5" fill="#999" text-anchor="middle">gap &lt;</text>
<text x="628" y="146" font-size="10.5" fill="#999" text-anchor="middle">spacing</text>
<!-- false bridge tetra -->
<path d="M470 112 L500 150 L530 112 Z" fill="#b3261e" fill-opacity="0.14" stroke="#b3261e" stroke-width="1.8"/>
<text x="500" y="132" font-size="11" fill="#b3261e" text-anchor="middle" font-weight="700">false bridge</text>
<!-- three metric lenses rescoring the same cell -->
<g transform="translate(438,206)"><circle cx="0" cy="0" r="12" fill="none" stroke="#4f46e5" stroke-width="2"/><text x="0" y="30" font-size="11" fill="#333" text-anchor="middle">B4 ○</text></g>
<g transform="translate(500,206)"><ellipse cx="0" cy="0" rx="16" ry="8" fill="none" stroke="#4f46e5" stroke-width="2"/><text x="0" y="30" font-size="11" fill="#333" text-anchor="middle">B5 ⬭</text></g>
<g transform="translate(562,206)"><g transform="rotate(-28)"><ellipse cx="0" cy="0" rx="16" ry="8" fill="none" stroke="#4f46e5" stroke-width="2"/><line x1="-16" y1="0" x2="16" y2="0" stroke="#4f46e5" stroke-width="1"/></g><text x="0" y="30" font-size="11" fill="#333" text-anchor="middle">P1 SPD</text></g>
<text x="500" y="252" font-size="11.5" fill="#666" text-anchor="middle">same cells, different local metric</text>
<text x="626" y="212" font-size="26" fill="#c0392b" font-weight="700" text-anchor="middle">✗</text>
<text x="500" y="286" font-size="12" fill="#333333" text-anchor="middle">a per-cell threshold cannot remove it</text>
<text x="500" y="302" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">(b)</text>

<!-- =============== (c) change connectivity (M1) -> bridge gone =============== -->
<text x="46" y="342" font-size="13" fill="#333333" font-weight="700">Change connectivity (M1)</text>
<rect x="60" y="384" width="180" height="16" rx="4" fill="#efeff5" stroke="#c5c5d5" stroke-width="1.3"/>
<rect x="60" y="446" width="180" height="16" rx="4" fill="#efeff5" stroke="#c5c5d5" stroke-width="1.3"/>
<g fill="#666"><circle cx="90" cy="400" r="2.4"/><circle cx="120" cy="400" r="2.4"/><circle cx="150" cy="400" r="2.4"/><circle cx="180" cy="400" r="2.4"/><circle cx="210" cy="400" r="2.4"/>
<circle cx="90" cy="446" r="2.4"/><circle cx="120" cy="446" r="2.4"/><circle cx="150" cy="446" r="2.4"/><circle cx="180" cy="446" r="2.4"/><circle cx="210" cy="446" r="2.4"/></g>
<!-- gap now clean: dashed separation + green check -->
<line x1="66" y1="423" x2="234" y2="423" stroke="#2e9e44" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="150" y="418" font-size="10.5" fill="#2e9e44" text-anchor="middle">bridge simplex no longer exists</text>
<text x="262" y="430" font-size="26" fill="#2e9e44" font-weight="700" text-anchor="middle">✓</text>
<!-- lift inset -->
<rect x="60" y="486" width="290" height="30" rx="8" fill="#ffffff" stroke="#c9c9d9" stroke-width="1.3"/>
<text x="205" y="506" font-size="13.5" fill="#333333" text-anchor="middle" font-weight="600">weighted lift  p ↦ ( p , ‖p‖² − wᵢ ) ,  wᵢ=(s·spacingᵢ)²</text>
<text x="205" y="548" font-size="12" fill="#333333" text-anchor="middle">edits which simplices exist → strictly improves B4</text>
<text x="205" y="566" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">(c)</text>

<!-- =============== (d) frozen held-out verdict (real) =============== -->
<text x="410" y="342" font-size="13" fill="#333333" font-weight="700">Frozen held-out verdict (real meshes)</text>
<!-- zero envelope line -->
<line x1="430" y1="392" x2="700" y2="392" stroke="#333333" stroke-width="1.6"/>
<text x="712" y="396" font-size="10.5" fill="#666" text-anchor="end"></text>
<text x="565" y="382" font-size="10.5" fill="#666" text-anchor="middle">casewise B4/B5 envelope = 0</text>
<!-- B5 best marker (above line) -->
<rect x="440" y="360" width="40" height="30" fill="#1d4e89" fill-opacity="0.25" stroke="#1d4e89" stroke-width="1.3"/>
<text x="460" y="354" font-size="10.5" fill="#1d4e89" text-anchor="middle">B5 best</text>
<text x="460" y="378" font-size="10" fill="#1d4e89" text-anchor="middle">F .868</text>
<!-- downward margin bars for P1 P2 M1 -->
<rect x="520" y="392" width="26" height="70" fill="#b3261e" fill-opacity="0.5" stroke="#b3261e" stroke-width="1.2"/>
<text x="533" y="476" font-size="10.5" fill="#333" text-anchor="middle">P1</text>
<text x="533" y="488" font-size="9.5" fill="#666" text-anchor="middle">−.14</text>
<rect x="556" y="392" width="26" height="70" fill="#b3261e" fill-opacity="0.5" stroke="#b3261e" stroke-width="1.2"/>
<text x="569" y="476" font-size="10.5" fill="#333" text-anchor="middle">P2</text>
<text x="569" y="488" font-size="9.5" fill="#666" text-anchor="middle">−.14</text>
<rect x="592" y="392" width="26" height="47" fill="#d4a017" fill-opacity="0.55" stroke="#d4a017" stroke-width="1.2"/>
<text x="605" y="476" font-size="10.5" fill="#333" text-anchor="middle">M1</text>
<text x="605" y="488" font-size="9.5" fill="#666" text-anchor="middle">−.094</text>
<text x="662" y="430" font-size="10.5" fill="#666" text-anchor="middle">all</text>
<text x="662" y="443" font-size="10.5" fill="#666" text-anchor="middle">&lt; 0</text>
<!-- G4 fail-closed gate -->
<rect x="470" y="506" width="130" height="26" rx="8" fill="#eef2ee" stroke="#2e9e44"/>
<text x="535" y="523" font-size="12" fill="#333333" text-anchor="middle" font-weight="600">▶ FN = 0  (G4)</text>
<text x="565" y="552" font-size="12" fill="#333333" text-anchor="middle">local metric adds no value;</text>
<text x="565" y="567" font-size="12" fill="#333333" text-anchor="middle">M1 + fail-closed fallback survive</text>
<text x="565" y="584" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">(d)</text>
</svg>
